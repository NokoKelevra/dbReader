services:
  dbreader:
    build:
      context: .
      dockerfile: Dockerfile
    image: dbreader:latest
    ports:
      - "8000:8000"
    environment:
      DBREADER_DATABASE_DIRECTORY: /app/data
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
