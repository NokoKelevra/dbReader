services:
  dbreader:
    container_name: dbreader
    build:
      context: .
      dockerfile: Dockerfile
    image: dbreader:latest
    ports:
      - "8000:8000"
    environment:
      DBREADER_DATABASE_DIRECTORY: /app/data
      PYTHONUNBUFFERED: "1"
    volumes:
      - dbreader_data:/app/data
    restart: unless-stopped
    init: true

volumes:
  dbreader_data: